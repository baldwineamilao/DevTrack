<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DevTrack - Activity</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Font Awesome -->
     <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <div class="dashboard-container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="sidebar-logo">
                <i class="fa-solid fa-code sidebar-logo-icon"></i>
                <span>DevTrack</span>
            </div>

            <nav class="sidebar-nav">
                <a href="dashboard.html" class="sidebar-link">▦ Dashboard</a>
                <a href="projects.html" class="sidebar-link">▣ Projects</a>
                <a href="tasks.html" class="sidebar-link">✓ Tasks</a> 
                <a href="activity.html" class="sidebar-link">◷ Activity</a>
            </nav>

            <div class="sidebar-bottom">
                <a href="settings.html" class="sidebar-link">⚙ Settings</a>
                <a href="#" class="sidebar-link logout-link" id="logoutButton">↪ Logout</a>
            </div>

        </aside>


        <!-- Main Content -->

        <main class="main-content">

            <header class="topbar">

                <div>

                    <p class="page-label">
                        Workspace
                    </p>

                    <h1>
                        Activity
                    </h1>

                </div>

            </header>


            <!-- Activity Section -->

            <section class="dashboard-section">

                <div class="section-header">

                    <div>

                        <p class="section-label">
                            Workspace History
                        </p>

                        <h2>
                            Recent Activity
                        </h2>

                    </div>

                </div>


                <div id="activityContainer">

                    <div class="empty-state">

                        <div class="empty-icon">
                            ◷
                        </div>

                        <h3>
                            Loading activity...
                        </h3>

                        <p>
                            Please wait while your activity is loaded.
                        </p>

                    </div>

                </div>

            </section>

        </main>

    </div>

    <!-- Logout Confirmation Modal -->
<div class="modal-overlay" id="logoutModal">

    <div class="modal">

        <div class="modal-header">
            <h2>Logout</h2>
        </div>

        <div class="modal-body">
            <p>Are you sure you want to logout?</p>
        </div>

        <div class="modal-footer">

            <button
                type="button"
                class="secondary-button"
                id="cancelLogoutButton">
                Cancel
            </button>

            <button
                type="button"
                class="primary-button"
                id="confirmLogoutButton">
                Logout
            </button>

        </div>

    </div>

</div>

    <script src="js/auth.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/activity.js"></script>

</body>
</html>
